[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hetzner-auction-pipeline"
version = "0.1.20"
description = "Pipeline for fetching, enriching, and publishing Hetzner auction data"
authors = [
    {name = "jedarden", email = "jedarden@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
