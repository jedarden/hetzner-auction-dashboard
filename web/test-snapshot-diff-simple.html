<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapshot Diff Simple Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .test-results {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-results h2 {
            margin-top: 0;
        }
        .pass { color: #2e7d32; font-weight: bold; }
        .fail { color: #c62828; font-weight: bold; }
        button {
            background: #4c6ef5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #3b5bdb; }
    </style>
</head>
<body>
    <h1>Snapshot Diff Simple Test</h1>
    <p>Simple test for snapshot diff functionality</p>

    <div class="test-results">
        <h2>Test Controls</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearData()">Clear Data</button>
    </div>

    <div class="test-results" id="results">
        <h2>Test Results</h2>
        <div id="test-output"></div>
    </div>

    <script src="snapshot-diff.js"></script>
    <script>
        const testOutput = document.getElementById('test-output');

        function log(message, isPass = true) {
            const div = document.createElement('div');
            div.className = isPass ? 'pass' : 'fail';
            div.textContent = (isPass ? '✓ ' : '✗ ') + message;
            testOutput.appendChild(div);
        }

        async function runAllTests() {
            testOutput.innerHTML = '';
            log('Starting snapshot diff tests...');

            try {
                // Test 1: Initialize system
                await snapshotDiffManager.initialize();
                log('System initialized successfully');

                // Test 2: First snapshot (no previous data)
                const listings1 = createMockListings();
                const diff1 = await snapshotDiffManager.processCurrentListings(listings1);
                log('First snapshot created', diff1.hasPreviousData === false);

                // Test 3: Second snapshot (same data, no changes)
                const diff2 = await snapshotDiffManager.processCurrentListings(listings1);
                log('No changes detected with same data',
                    diff2.new.length === 0 && diff2.removed.length === 0 && diff2.priceChanges.length === 0);

                // Test 4: Third snapshot (new listing added)
                const listings2 = [...listings1, {
                    id: 4,
                    cpu_model: "Ryzen 7 5800X",
                    cpu_cores: 8,
                    ram_gb: 64,
                    disks: [{ type: "nvme", size_tb: 1 }],
                    price_effective_monthly: 38.25,
                    location: "fsn",
                    benchmark_multi: 28756,
                    benchmark_single: 3782,
                    benchmark_matched: true
                }];
                const diff3 = await snapshotDiffManager.processCurrentListings(listings2);
                log('New listing detected', diff3.new.length === 1);

                // Test 5: Fourth snapshot (price change)
                const listings3 = listings1.map(l => ({
                    ...l,
                    price_effective_monthly: l.id === 1 ? 40.00 : l.price_effective_monthly
                }));
                const diff4 = await snapshotDiffManager.processCurrentListings(listings3);
                log('Price change detected', diff4.priceChanges.length === 1);

                // Test 6: Fifth snapshot (removed listing)
                const listings4 = listings1.slice(1); // Remove first listing
                const diff5 = await snapshotDiffManager.processCurrentListings(listings4);
                log('Removed listing detected', diff5.removed.length === 1);

                log('All tests completed successfully!');

            } catch (error) {
                log('Test failed: ' + error.message, false);
                console.error(error);
            }
        }

        function createMockListings() {
            return [
                {
                    id: 1,
                    cpu_model: "Ryzen 9 5950X",
                    cpu_cores: 16,
                    ram_gb: 128,
                    disks: [{ type: "nvme", size_tb: 2 }],
                    price_effective_monthly: 45.99,
                    location: "fsn",
                    benchmark_multi: 51234,
                    benchmark_single: 4287,
                    benchmark_matched: true
                },
                {
                    id: 2,
                    cpu_model: "Xeon E5-2680 v4",
                    cpu_cores: 14,
                    ram_gb: 64,
                    disks: [{ type: "hdd", size_tb: 4 }],
                    price_effective_monthly: 28.50,
                    location: "nbg",
                    benchmark_multi: 18907,
                    benchmark_single: 2134,
                    benchmark_matched: true
                },
                {
                    id: 3,
                    cpu_model: "Core i7-12700",
                    cpu_cores: 12,
                    ram_gb: 32,
                    disks: [{ type: "nvme", size_tb: 1 }],
                    price_effective_monthly: 22.75,
                    location: "hel",
                    benchmark_multi: 24843,
                    benchmark_single: 3891,
                    benchmark_matched: true
                }
            ];
        }

        async function clearData() {
            await snapshotDiffManager.reset();
            testOutput.innerHTML = '';
            log('Data cleared');
        }
    </script>
</body>
</html>
